name: Build game

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot and Android signing
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/ ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable || true
          cp -r /root/.config/godot/. ~/.config/godot/ || true
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /root/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Import project
        run: godot --headless --verbose --import || true

      - name: Export Android APK
        run: |
          mkdir -v -p build/android
          godot --headless --verbose --export-debug "Android" build/android/AshenVow.apk

      - name: Export Windows
        run: |
          mkdir -v -p build/windows
          godot --headless --verbose --export-release "Windows Desktop" build/windows/AshenVow.exe

      - uses: actions/upload-artifact@v4
        with:
          name: AshenVow-android
          path: build/android/AshenVow.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AshenVow-windows
          path: build/windows/AshenVow.exe
